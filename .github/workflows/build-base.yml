name: Talebook base image

on:
  pull_request:
    paths:
      - .dockerignore
      - .github/workflows/build-base.yml
      - Dockerfile
      - Makefile
      - packaging/**
      - resources/**
      - setup/**
      - src/**
  push:
    branches:
      - slim-v8.5.0
    paths:
      - .dockerignore
      - .github/workflows/build-base.yml
      - Dockerfile
      - Makefile
      - packaging/**
      - resources/**
      - setup/**
      - src/**
  workflow_dispatch:
    inputs:
      push_image:
        description: Push the tested multi-platform image to Docker Hub
        required: true
        type: boolean
        default: false
      version:
        description: Image version tag
        required: true
        type: string
        default: slim-v8.5.0
      platforms:
        description: Comma-separated platforms for the published image
        required: true
        type: string
        default: linux/amd64,linux/arm64
      build_country:
        description: Set to CN to use the configured Debian mirror
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  IMAGE_NAME: talebook/talebook-base

jobs:
  test:
    name: Build and smoke (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci-${{ matrix.arch }}
          build-args: |
            BUILD_COUNTRY=${{ inputs.build_country || '' }}
          cache-from: type=gha,scope=talebook-base-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=talebook-base-${{ matrix.arch }}

      - name: Run image smoke test
        env:
          TEST_IMAGE: ${{ env.IMAGE_NAME }}:ci-${{ matrix.arch }}
          MAX_USR_MIB: '400'
        run: |
          docker image inspect "$TEST_IMAGE" --format 'Image size: {{.Size}} bytes'
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -e "TALEBOOK_MAX_USR_MIB=$MAX_USR_MIB" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            --entrypoint /bin/sh \
            "$TEST_IMAGE" \
            packaging/smoke-test.sh

  publish:
    name: Publish multi-platform image
    if: github.event_name == 'workflow_dispatch' && inputs.push_image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            BUILD_COUNTRY=${{ inputs.build_country }}
          cache-from: type=gha,scope=talebook-base-publish
          cache-to: type=gha,mode=max,scope=talebook-base-publish
